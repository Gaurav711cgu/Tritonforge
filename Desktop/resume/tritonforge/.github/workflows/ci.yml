name: TritonForge CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test-correctness:
    name: Run Kernel Correctness & Memory Reduction Tests (CPU Fallback)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pytest-cov tabulate matplotlib
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f tritonforge/requirements.txt ]; then pip install -r tritonforge/requirements.txt; fi

      - name: Run Pytest Kernel Correctness Suite
        run: |
          PYTHONPATH=. pytest tritonforge/tests/ -v --tb=short
