name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PYTHONPATH=. pytest torch triton ruff mypy
      - name: Run Pytest CPU Fallback Suite
        run: |
          PYTHONPATH=. pytest tests/ -v
      - name: Run CI Benchmark Drift Guard
        run: |
          python benchmarks/card_vs_json_check.py
