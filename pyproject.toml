[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tritonforge"
version = "1.0.0"
description = "High-Performance GPU Kernel Optimization Engine (Triton & CUDA C++)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Gaurav Kumar Nayak"}]
dependencies = [
    "torch>=2.1.0"
]
